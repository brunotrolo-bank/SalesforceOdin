/* ── ANTECIPACAO STEPS ─────────────────────────────────────────────── */

/* STEP 1 — Lista de parcelamentos
   Valor da parcela = PMT + seguro (valor real cobrado ao cliente) */
function step1(){
  var cards=PARCELAMENTOS.map(function(p){
    var sd=getSaldo(p);
    var tab=calcPrice(p.principal,p.taxa,p.n,p.data);
    var pmt=tab[0].pmt;
    var totalParcela=pmt+p.seguro; /* PMT + Seguro Prestamista */
    var isSel=S.parcSel&&S.parcSel.id===p.id;
    return '<div class="parc-card'+(isSel?' sel':'')+'" onclick="da(\'selParc\',\''+p.id+'\')">'
      +'<div class="parc-card-hdr"><div><div class="parc-card-ref">'+esc(p.ref)+'</div><div style="font-size:10px;color:#706e6b;margin-top:2px">Contratado em '+ptDt(p.data)+' &middot; '+esc(CARTOES[0].label)+'</div></div><div style="display:flex;gap:5px"><span class="bg-green">Ativo</span>'+(isSel?'<span class="bg-blue">&#10003; Selecionado</span>':'')+'</div></div>'
      +'<div class="parc-info-grid">'
        +'<div class="pib"><div class="pib-l">Valor da Parcela (com Seguro)</div><div class="pib-v">'+brl(totalParcela)+'</div></div>'
        +'<div class="pib"><div class="pib-l">Parcela (Amortz+Juros)</div><div class="pib-v" style="font-size:11px;color:#706e6b">'+brl(pmt)+'</div></div>'
        +'<div class="pib"><div class="pib-l">Seguro Prestamista</div><div class="pib-v" style="font-size:11px;color:#706e6b">'+brl(p.seguro)+'</div></div>'
        +'<div class="pib"><div class="pib-l">Total de Parcelas</div><div class="pib-v">'+p.n+'x</div></div>'
        +'<div class="pib"><div class="pib-l">Taxa do Contrato</div><div class="pib-v">'+pct(p.taxa)+'</div></div>'
        +'<div class="pib"><div class="pib-l">Data Pr&#243;x. Vencimento</div><div class="pib-v">'+ptDt(p.dataProxVenc)+'</div></div>'
      +'</div>'
      +'<div class="parc-rows">'
        +'<div class="parc-stat fat"><div class="parc-stat-n">'+p.parcelasPagas+'</div><div class="parc-stat-l">Parcela(s) Paga(s)<br><span style="font-size:9px">J&#225; na fatura vigente</span></div></div>'
        +'<div class="parc-stat dis"><div class="parc-stat-n">'+(p.n-p.parcelasPagas)+'</div><div class="parc-stat-l">Em Aberto<br><span style="font-size:9px">Dispon&#237;veis para antecipa&#231;&#227;o</span></div></div>'
      +'</div>'
      +'<div class="saldo-box"><div class="saldo-l">Saldo Devedor Total<br><span style="font-size:10px;color:#706e6b">('+sd.count+' parcelas em aberto)</span></div><div class="saldo-vals"><div style="text-align:right"><div class="saldo-item-l">Vr. Original (Amortz+Juros)</div><div class="saldo-item-v">'+brl(sd.valorOrig)+'</div></div><div style="text-align:right"><div class="saldo-item-l">Vr. Amortz (descapitalizado)</div><div class="saldo-item-v blue">'+brl(sd.valorAmortz)+'</div></div></div></div>'
    +'</div>';
  }).join('');
  return '<p style="font-size:11px;color:#706e6b;margin-bottom:10px">Parcelamentos ativos vinculados a este cart&#227;o. Selecione o contrato para simular:</p>'+cards+'<div class="fe mt4">'+btn('Simular Antecipa&#231;&#227;o','confirmarSelParc','bp',!S.parcSel)+'</div>';
}

/* STEP 2 — Detalhes do parcelamento */
function step2(){
  var p=S.parc,tab=calcPrice(p.principal,p.taxa,p.n,p.data),pmt=tab[0].pmt;
  var av=getEmAberto(p),sd=getSaldo(p);
  var rows=(S.showAll?tab:tab.slice(0,4)).map(function(r){
    var isPaga=r.num<=p.parcelasPagas;
    return '<tr'+(isPaga?' class="blocked"':'')+'><td class="c">'+r.num+(isPaga?' <span class="bg-red">Paga</span>':'')+'</td><td>'+ptDt(r.venc)+'</td><td class="r">'+brl(r.pmt)+'</td><td class="r" style="color:#0070d2;font-weight:500">'+brl(r.amort)+'</td><td class="r" style="color:#706e6b">'+brl(r.juros)+'</td><td class="r">'+brl(r.saldo)+'</td></tr>';
  }).join('');
  return '<div class="fgrid mb4">'
    +fld('Identificador (Ref.)',p.ref)
    +fld('Dados do Cart&#227;o',CARTOES[0].label)
    +fld('Data de Contrata&#231;&#227;o',ptDt(p.data))
    +fld('Valor da Parcela (Amortz+Juros)',brl(pmt))
    +fld('Seguro Prestamista / Parcela',brl(p.seguro))

    +fld('Qtd. Total de Parcelas',p.n+'x')

    +fld('Data Pr&#243;x. Vencimento',ptDt(p.dataProxVenc))
    +fld('Parcelas Pagas',p.parcelasPagas+' parcela(s) na fatura vigente')
    +fld('Parcelas em Aberto',av.length+' dispon&#237;veis para antecipa&#231;&#227;o')
    +fld('Saldo Devedor (Vr. Amortz)',brl(sd.valorAmortz))
  +'</div>'
  +'<p style="font-size:11px;font-weight:600;color:#3e3e3c;margin-bottom:5px">Tabela de Amortiza&#231;&#227;o &mdash; Sistema Price <span style="font-weight:400;color:#706e6b">(Seguro Prestamista n&#227;o inclu&#237;do)</span></p>'
  +'<div class="tw mb3"><table class="ot"><thead><tr><th class="c">N&#186;</th><th>Vencimento</th><th class="r">Presta&#231;&#227;o</th><th class="r">Amortiza&#231;&#227;o</th><th class="r">Juros</th><th class="r">Saldo Dev.</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
  +(!S.showAll?'<button class="lnk mb3" onclick="da(\'toggleAll\',\'\')">&#8595; Ver todas as '+tab.length+' parcelas</button>':'<button class="lnk mb3" onclick="da(\'toggleAll\',\'\')">&#8593; Recolher</button>')
  +'<div class="fb mt4">'+btn('&larr; Voltar','voltarStep','bg')+'<div class="fg">'+btn('Antecipa&#231;&#227;o Parcial','escolherModal','bo',false,'parcial')+btn('Quita&#231;&#227;o Total','escolherModal','bp',false,'total')+'</div></div>';
}

/* Bloco de destaque seguro — usado em step3total e step3parcial */
function blocoSeguro(valorAmort, valorSeguro, valorTotal, nParcelas){
  return '<div style="border:2px solid #0070d2;border-radius:4px;padding:12px;background:#eaf5fe;margin-bottom:14px">'
    +'<div style="font-size:11px;font-weight:700;color:#0070d2;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">Valor a Pagar</div>'
    +'<div style="display:flex;align-items:flex-end;gap:16px">'
      +'<div style="flex:1">'
        +'<table style="width:100%;border-collapse:collapse;font-size:11px">'
          +'<tr><td style="padding:3px 0;color:#706e6b">Valor antecipado (Amortz):</td><td style="text-align:right;font-weight:600;color:#3e3e3c">'+brl(valorAmort)+'</td></tr>'
          +'<tr><td style="padding:3px 0;color:#706e6b">+ Seguro Prestamista ('+nParcelas+'&times;'+brl(valorSeguro/nParcelas)+'):</td><td style="text-align:right;font-weight:600;color:#706e6b">'+brl(valorSeguro)+'</td></tr>'
          +'<tr style="border-top:1px solid #c7e0f4"><td style="padding:5px 0 3px;font-weight:700;color:#0070d2">= Total com Seguro:</td><td style="text-align:right;font-size:18px;font-weight:800;color:#0070d2;padding:5px 0 3px">'+brl(valorTotal)+'</td></tr>'
        +'</table>'
      +'</div>'
    +'</div>'
  +'</div>';
}

/* STEP 3 — Quitação Total */
function step3total(){
  var p=S.parc,av=getEmAberto(p),sd=getSaldo(p);
  var valorAmort=sd.valorAmortz;
  var valorSeguro=p.seguro*av.length;
  var valorTotal=valorAmort+valorSeguro;
  return al('w','<strong>Parcela(s) paga(s):</strong> '+p.parcelasPagas+' parcela(s) j&#225; na fatura vigente (lan&#231;amento '+ptDt(p.dataUltimaPaga)+') n&#227;o podem ser antecipadas. A simula&#231;&#227;o considera as <strong>'+av.length+' parcelas em aberto</strong>.')
    +'<div class="scards">'
      +'<div class="sc"><div class="sc-l">Valor sem antecipa&#231;&#227;o (Orig.)</div><div class="sc-v">'+brl(sd.valorOrig+(p.seguro*av.length))+'</div><div class="sc-s">'+av.length+' parc. &times; '+brl(av.length>0?(sd.valorOrig/av.length)+p.seguro:0)+'</div></div>'
      +'<div class="sc yw"><div class="sc-l">Juros economizados (desconto)</div><div class="sc-v">'+brl(sd.juros)+'</div><div class="sc-s">Descapitaliza&#231;&#227;o das parcelas</div></div>'
      +'<div class="sc" style="background:#f3f2f2"><div class="sc-l">Valor antecipado (sem seguro)</div><div class="sc-v">'+brl(valorAmort)+'</div><div class="sc-s">Amortz &times; '+av.length+' parcelas</div></div>'
    +'</div>'
    +blocoSeguro(valorAmort,valorSeguro,valorTotal,av.length)
    +al('i','<strong>Aten&#231;&#227;o:</strong> O valor total de <strong>'+brl(valorTotal)+'</strong> ser&#225; lan&#231;ado na pr&#243;xima fatura (venc. <strong>'+ptDt(PROXIMA)+'</strong>).')
    +'<div class="fb mt4">'+btn('&larr; Voltar','voltarStep','bg')+btn('Confirmar Quita&#231;&#227;o Total','confirmarTotal','bs')+'</div>';
}

/* STEP 3 — Antecipação Parcial com checkboxes livres */
function step3parcial(){
  var p=S.parc;
  var tab=calcPrice(p.principal,p.taxa,p.n,p.data);
  var selNums=S.selNums;
  var rows=tab.map(function(r){
    var isPaga=r.num<=p.parcelasPagas,isSel=selNums.indexOf(r.num)>=0;
    if(isPaga)return '<tr class="blocked"><td class="c"><input type="checkbox" disabled></td><td class="c">'+r.num+' <span class="bg-red">Paga</span></td><td>'+ptDt(r.venc)+'</td><td class="r" style="color:#aaa">'+brl(r.pmt)+'</td><td class="r" style="color:#aaa">'+brl(r.amort)+'</td><td class="r" style="color:#aaa">'+brl(r.juros)+'</td></tr>';
    return '<tr class="cl'+(isSel?' sel':'')+'" onclick="da(\'togParcela\',\''+r.num+'\')"><td class="c"><input type="checkbox"'+(isSel?' checked':'')+' onclick="event.stopPropagation();da(\'togParcela\',\''+r.num+'\')" style="accent-color:#0070d2;cursor:pointer"></td><td class="c">'+r.num+'</td><td>'+ptDt(r.venc)+'</td><td class="r">'+brl(r.pmt)+'</td><td class="r" style="color:#0070d2;font-weight:500">'+brl(r.amort)+'</td><td class="r" style="color:#706e6b">'+brl(r.juros)+'</td></tr>';
  }).join('');
  var selRows=tab.filter(function(r){return selNums.indexOf(r.num)>=0;});
  var valorAmort=selRows.reduce(function(s,r){return s+r.amort;},0);
  var valorJuros=selRows.reduce(function(s,r){return s+r.juros;},0);
  var valorSeguro=p.seguro*selRows.length;
  var valorTotal=valorAmort+valorSeguro;
  var n=selRows.length;
  var resumeHtml=n===0?'<p style="font-size:11px;color:#706e6b;font-style:italic">Selecione as parcelas desejadas</p>':
    '<div class="rr"><div class="rr-l">Qtd. selecionada</div><div class="rr-v">'+n+' parcela'+(n>1?'s':'')+'</div></div>'
    +'<div class="rr"><div class="rr-l">Juros economizados</div><div class="rr-v" style="color:#04844b">'+brl(valorJuros)+'</div></div>'
    +'<div style="border:1px solid #0070d2;border-radius:3px;padding:7px;background:#eaf5fe;margin-top:4px">'
      +'<div style="font-size:10px;color:#0070d2;font-weight:700;margin-bottom:4px">Valor a Pagar</div>'
      +'<div style="font-size:10px;color:#706e6b">Amortz: <strong style="color:#3e3e3c">'+brl(valorAmort)+'</strong></div>'
      +'<div style="font-size:10px;color:#706e6b">+ Seguro: <strong style="color:#706e6b">'+brl(valorSeguro)+'</strong></div>'
      +'<div style="font-size:14px;font-weight:800;color:#0070d2;margin-top:3px;border-top:1px solid #c7e0f4;padding-top:3px">'+brl(valorTotal)+'</div>'
    +'</div>';
  var warnHtml=n>0?al('w','<strong>Aten&#231;&#227;o ao cliente:</strong> As parcelas em aberto n&#227;o selecionadas continuar&#227;o sendo cobradas normalmente nas faturas subsequentes.'):'';
  return al('e','<strong>Parcela(s) paga(s):</strong> '+p.parcelasPagas+' parcela(s) j&#225; na fatura (lan&#231;amento '+ptDt(p.dataUltimaPaga)+') n&#227;o podem ser antecipadas. Selecione livremente as parcelas <strong>em aberto</strong>:')
    +'<div class="pl">'
      +'<div class="ptw"><p style="font-size:11px;color:#706e6b;margin-bottom:6px">Selecione as parcelas <strong>em aberto</strong> &mdash; qualquer combina&#231;&#227;o &#233; permitida:</p>'
        +'<div class="tw"><div class="tsrl"><table class="ot"><thead style="position:sticky;top:0;background:#f3f2f2;z-index:5"><tr><th style="width:28px"></th><th class="c">N&#186;</th><th>Vencimento</th><th class="r">Presta&#231;&#227;o</th><th class="r">Amortiza&#231;&#227;o</th><th class="r">Juros</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
      +'</div>'
      +'<div class="psb"><div class="rb"><div class="rb-t">Resumo da Simula&#231;&#227;o</div>'+resumeHtml+'</div>'+warnHtml+'</div>'
    +'</div>'
    +'<div class="fb mt4">'+btn('&larr; Voltar','voltarStep','bg')+btn('Confirmar Antecipa&#231;&#227;o Parcial','confirmarParcial','bp',n===0)+'</div>';
}

      +'<div class="cfr"><span class="cfr-l">Valor antecipado (Amortz, sem seguro)</span><span class="cfr-v">'+brl(conf.valorAmort)+'</span></div>'

    +'<div style="background:#eaf5fe;border:2px solid #0070d2;border-radius:3px;padding:8px;display:flex;justify-content:space-between;align-items:center">'
      +'<span style="font-weight:700;color:#3e3e3c;font-size:12px">= Valor Total a Pagar (com Seguro)</span>'
      +'<span style="font-weight:800;color:#0070d2;font-size:16px">'+brl(conf.valor)+'</span>'
    +'</div>'

  +al('i','<strong>Script para o atendente:</strong><br>"Senhor(a), confirma a '+(isTotal?'quita&#231;&#227;o total de '+nP+' parcelas em aberto':'antecipa&#231;&#227;o de '+nP+' parcela'+(nP>1?'s':''))+' do contrato '+esc(p.ref)+'? O valor a pagar ser&#225; de <strong>'+brl(conf.valor)+'</strong> (sendo '+brl(conf.valorAmort)+' de amortiza&#231;&#227;o + '+brl(conf.valorSeguro)+' de seguro prestamista), lan&#231;ado na pr&#243;xima fatura com vencimento em <strong>'+ptDt(PROXIMA)+'</strong>. Gera uma economia de <strong>'+brl(conf.economia)+'</strong> em juros."')

/* ── PARCELAMENTO TAB ──────────────────────────────────────────────── */
function renderParcelamentoFatura(){
  if(!S.showAntecipacao){
    return '<div class="parc-btns-wrap"><button class="btn-navy"><span>&#128196;</span> Consultar op&#231;&#245;es de parcelamento</button><div class="divider-h" style="width:280px"></div><button class="btn-antec" onclick="da(\'showAntecipacao\',\'\')"><span>&#128257;</span> Simular Antecipa&#231;&#227;o de Parcelamentos</button></div>';
  }
  var titles={1:'Antecipa&#231;&#227;o de Parcelamento',2:'Detalhes do Parcelamento',3:S.modal==='total'?'Simula&#231;&#227;o &mdash; Quita&#231;&#227;o Total':'Simula&#231;&#227;o &mdash; Antecipa&#231;&#227;o Parcial',4:'Confirma&#231;&#227;o',5:'Opera&#231;&#227;o Confirmada'};
  var sbar=(S.step>1&&S.step<5)?'<div class="si">'+[1,2,3,4].map(function(s){return '<div class="sd'+(s<S.step?' dn':'')+'"></div>';}).join('')+'</div>':'';
  var content='';
  if(S.step===1)content=step1();
  else if(S.step===2)content=step2();
  else if(S.step===3&&S.modal==='total')content=step3total();
  else if(S.step===3&&S.modal==='parcial')content=step3parcial();
  else if(S.step===4)content=step4();
  else if(S.step===5)content=step5();
  return '<div><div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button class="bg" onclick="da(\'hideAntecipacao\',\'\')">&#10005; Fechar</button></div><div class="stb"><div class="st">'+titles[S.step]+'</div>'+sbar+'</div>'+content+'</div>';
}

  }
  return '<p style="font-size:11px;color:#706e6b;font-style:italic;padding:14px 0">Conte&#250;do da aba em exibi&#231;&#227;o.</p>';
}

  var T2=[['detalhes','Detalhes da Conta'],['massificados','Massificados'],['ofertas','Ofertas personalizadas'],['retencao','Reten&#231;&#227;o'],['conect','ConectCar'],['autorizacoes','Autoriza&#231;&#245;es'],['fraude','Fraude e Desacordo'],['contestacoes','Demais Contesta&#231;&#245;es'],['portoplus','Portoplus'],['limite','Limite de Cr&#233;dito'],['ajustes','Ajustes monet&#225;rios']];
  var T3=[['fatura','Fatura'],['manutencao','Manuten&#231;&#227;o da Conta'],['troca','Troca de Representante'],['manuCar','Manuten&#231;&#227;o do Cart&#227;o'],['dossie','Consulta Dossi&#234;'],['viagem','Aviso de Viagem'],['bloq','Bloq/Desbloq Comunica&#231;&#227;o']];
  var T4=[['resumo','Resumo'],['antigas','Faturas antigas'],['cotacao','Cota&#231;&#227;o do D&#243;lar'],['vencimento','Altera&#231;&#227;o de Vencimento'],['historico','Hist&#243;rico de Pagamentos'],['parcelamento','Parcelamento da Fatura'],['forma','Forma de Pagamento'],['ddc','Consulta DDC'],['iof','IOF Zero']];
  var t2=T2.map(function(x){return '<button class="ti ti-lg'+(S.tab2===x[0]?' act':'')+'" onclick="da(\'t2\',\''+x[0]+'\')">'+x[1]+'</button>';}).join('');
  var t3=T3.map(function(x){return '<button class="ti'+(S.tab3===x[0]?' act':'')+'" onclick="da(\'t3\',\''+x[0]+'\')">'+x[1]+'</button>';}).join('');
  var t4=T4.map(function(x){return '<button class="ti'+(S.tab4===x[0]?' act':'')+'" onclick="da(\'t4\',\''+x[0]+'\')">'+x[1]+'</button>';}).join('');
  var ddHtml=S.showDD?'<div class="cs-dd">'+CARTOES.map(function(cc,i){return '<button class="cs-dd-item'+(i===S.cartaoIdx?' sel':'')+'" onclick="da(\'selC\',\''+i+'\')">'+(i===S.cartaoIdx?'&#10003; ':'')+esc(cc.label)+'</button>';}).join('')+'</div>':'';
  var cardBrand=c.tipo==='visa'?'<span style="color:white;font-size:9px;font-weight:bold;font-style:italic">VISA</span>':'<span style="color:white;font-size:9px;font-weight:bold">MC</span>';
  return '<div class="app">'+renderTopNav()
    +'<div class="rectab"><div class="rectab-item">&#128100; '+esc(CLIENTE.nome.split(' ').slice(0,2).join(' ').toUpperCase())+'... <span style="color:#706e6b;font-size:10px;margin-left:3px">&#10005;</span></div></div>'
    +'<div class="layout">'+renderSidebar()
    +'<div class="main"><div class="tab-bar"><button class="ti ti-lg" style="color:#3e3e3c;border-bottom:2px solid #3e3e3c">Cart&#227;o PortoBank</button><button class="ti ti-lg">Conta Digital</button><button class="ti ti-lg">Cons&#243;rcio</button></div>'
    +'<div class="cp">'
      +'<div class="tab-bar" style="margin:0 -14px 14px;padding:0 14px">'+t2+'</div>'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">'
        +'<div class="cs-wrap"><div style="font-size:11px;color:#706e6b;margin-bottom:2px">Selecione a conta</div>'
        +'<button class="cs-btn" onclick="da(\'togDD\',\'\')"><span style="flex:1;text-align:left">'+esc(c.label)+'</span> &#9660;</button>'+ddHtml+'</div>'
        +'<div class="card-img"><div style="display:flex;justify-content:space-between"><span style="color:white;font-size:8px;font-weight:bold">PortoBank</span><div style="width:14px;height:14px;background:rgba(255,255,255,0.2);border-radius:50%"></div></div><div style="text-align:right">'+cardBrand+'</div></div>'
      +'</div>'
      +'<div class="sec-hdr"><div class="sec-ico">&#8801;</div><span style="font-size:13px;font-weight:600;color:#3e3e3c">Dados da conta '+esc(c.label)+'</span></div>'
      +'<div class="fgrid">'+fld('N&#250;mero do Cart&#227;o','*****')+fld('Grupo Afinidade',S.cartaoIdx===0?'1-PADR&#195;O':'101-PADR&#195;O 2&#170; BANDEIRA')+fld('Status da Conta Bloq1',S.cartaoIdx===0?'A-Inatividade':'Ativo Bloq1 Branco',S.cartaoIdx===1)+fld('&#218;ltima Atualiza&#231;&#227;o','08/11/2024')+fld('Status da Conta Bloq2','Ativo Bloq2 Branco',true)+fld('&#218;ltima Atualiza&#231;&#227;o','19/05/2026')+fld('Status do cart&#227;o (Bloq Pl&#225;stico Tit)',S.cartaoIdx===0?'F - Falsificado/Fraude':'M - Envio Correio/Bloqueado')+fld('&#218;ltima Atualiza&#231;&#227;o','15/10/2024')+fld('Limite de Cr&#233;dito Total','*****')+fld('Limite de Cr&#233;dito Dispon&#237;vel','*****')+fld('Dia de Vencimento da Fatura','*****')+fld('Melhor data para compra','11/07/2026')+fld('Modo de Recebimento','Email')+fld('D&#233;bito em Conta?','N&#227;o')+fld('Data de Abertura da Conta','04/09/2023')+fld('Dias em atraso','0')+'</div>'

/* ── ACTION HANDLER ────────────────────────────────────────────────── */
var NAV_ACTIONS=['buscarCliente','selProduto','voltarM1','voltarM2','selConta','avancar','t2','t3','t4','togDD','selC','selPeriodo'];

function partialUpdateAntc(){var el=document.getElementById('antc');if(el){el.innerHTML=renderParcelamentoFatura();return true;}return false;}

function da(a,d){
  if(a==='buscarCliente')S.tela='modal1';
  else if(a==='selProduto')S.tela='modal2';
  else if(a==='voltarM1')S.tela='home';
  else if(a==='voltarM2')S.tela='modal1';
  else if(a==='selConta')S.contaSel=parseInt(d);
  else if(a==='avancar'){S.cartaoIdx=S.contaSel;S.tela='main';S.tab4='parcelamento';S.showAntecipacao=false;}
  else if(a==='t2')S.tab2=d;
  else if(a==='t3')S.tab3=d;
  else if(a==='t4'){S.tab4=d;S.showAntecipacao=false;}
  else if(a==='togDD')S.showDD=!S.showDD;
  else if(a==='selC'){S.cartaoIdx=parseInt(d);S.showDD=false;}
  else if(a==='selPeriodo')S.periodIdx=parseInt(d);
  else if(a==='showAntecipacao'){S.showAntecipacao=true;S.step=1;S.parc=null;S.modal=null;S.conf=null;S.parcSel=null;S.selNums=[];}
  else if(a==='hideAntecipacao')S.showAntecipacao=false;
  else if(a==='selParc'){S.parcSel=PARCELAMENTOS.filter(function(p){return p.id===parseInt(d);})[0]||null;}
  else if(a==='confirmarSelParc'){if(S.parcSel){S.parc=S.parcSel;S.step=2;S.showAll=false;}}
  else if(a==='toggleAll')S.showAll=!S.showAll;
  else if(a==='escolherModal'){S.modal=d;S.step=3;S.selNums=[];}
  else if(a==='togParcela'){var num=parseInt(d);var idx=S.selNums.indexOf(num);if(idx>=0)S.selNums.splice(idx,1);else S.selNums.push(num);}
  else if(a==='voltarStep'){if(S.step===2)S.step=1;else if(S.step===3)S.step=2;else if(S.step===4)S.step=3;}
  else if(a==='confirmarTotal'){
    var p=S.parc,sd=getSaldo(p);
    var av=getEmAberto(p);
    var vAmort=sd.valorAmortz;
    var vSeg=p.seguro*av.length;
    S.conf={tipo:'total',valor:vAmort+vSeg,valorAmort:vAmort,valorSeguro:vSeg,economia:sd.juros,parcelas:av.map(function(r){return r.num;})};
    S.step=4;
  }
  else if(a==='confirmarParcial'){
    if(S.selNums.length===0)return;
    var tab2=calcPrice(S.parc.principal,S.parc.taxa,S.parc.n,S.parc.data);
    var selR=tab2.filter(function(r){return S.selNums.indexOf(r.num)>=0;});
    var vA=selR.reduce(function(s,r){return s+r.amort;},0);
    var vJ=selR.reduce(function(s,r){return s+r.juros;},0);
    var vSg=S.parc.seguro*selR.length;
    S.conf={tipo:'parcial',parcelas:S.selNums.slice().sort(function(a,b){return a-b;}),valor:vA+vSg,valorAmort:vA,valorSeguro:vSg,economia:vJ};
    S.step=4;
  }
  else if(a==='finalizar')S.step=5;
  else if(a==='resetFlow'){S.step=1;S.parc=null;S.modal=null;S.conf=null;S.parcSel=null;S.selNums=[];S.showAll=false;}

  if(NAV_ACTIONS.indexOf(a)>=0){render();}
  else{if(!partialUpdateAntc())render();}
}

function render(){
  if(S.tela==='main'){document.getElementById('root').innerHTML=renderMain();}
  else{document.getElementById('root').innerHTML=renderHome();}
}
render();

</script>
